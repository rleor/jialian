name: Build 家练 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "prototype/**"
      - "scripts/**"
      - "src/**"
      - "backend/**"
      - "deploy/**"
      - "compose.yml"
      - "tests/**"
      - "android/**"
      - "package*.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "prototype/**"
      - "scripts/**"
      - "src/**"
      - "backend/**"
      - "deploy/**"
      - "compose.yml"
      - "tests/**"
      - "android/**"
      - "package*.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jialian_test
          POSTGRES_USER: jialian_test
          POSTGRES_PASSWORD: jialian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jialian_test -d jialian_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --prefix backend
      - name: Test API against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://jialian_test:jialian_test@localhost:5432/jialian_test
        run: npm test --prefix backend
      - name: Validate Compose and build backend image
        env:
          POSTGRES_PASSWORD: build-test-password
        run: |
          docker compose config --quiet
          docker build -t jialian-backend:test backend
          docker run --rm -d --name jialian-api-smoke --network host \
            -e DATABASE_URL=postgresql://jialian_test:jialian_test@localhost:5432/jialian_test \
            jialian-backend:test
          trap 'docker stop jialian-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs jialian-api-smoke
          exit 1
  build:
    needs: backend-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Build and check web app
        env:
          JIALIAN_API_BASE_URL: ${{ vars.JIALIAN_API_BASE_URL }}
        run: |
          npm run build
          npm test
      - name: Sync Android assets
        run: npx cap sync android
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore optional test signing identity
        env:
          DEBUG_KEYSTORE: ${{ secrets.JIALIAN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Prepare download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/jialian-debug.apk
          sha256sum artifacts/jialian-debug.apk > artifacts/SHA256SUMS.txt
          tar --exclude=node_modules --exclude=.env -czf artifacts/jialian-backend.tar.gz backend deploy compose.yml docs/backend-setup.md
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jialian-debug-apk-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
