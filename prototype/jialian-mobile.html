<script>
(()=>{
const root=document.getElementById('lianri-mobile'), main=root.querySelector('.lr-main'), nav=root.querySelector('.lr-nav'), notice=root.querySelector('.lr-notice');
const today=2, names=['一','二','三','四','五','六','日'];
const templates={
1:[[0,['胸','背','肩','臀腿']]],
2:[[0,['胸','背','肩','臀腿']],[3,['臀腿','肩','胸','背']]],
3:[[0,['胸','肩','三头']],[2,['背','二头']],[4,['臀腿','核心']]],
4:[[0,['胸','三头']],[2,['背','二头']],[4,['肩','核心']],[6,['臀腿']]],
5:[[0,['胸','三头']],[1,'有氧'],[2,['背','二头']],[4,['肩','核心']],[6,['臀腿']]],
6:[[0,['胸','三头']],[1,'有氧'],[2,['背','二头']],[3,['臀腿']],[4,'有氧'],[5,['肩','核心']]]
};
function musclePlan(parts,minutes=25){return {title:parts.join('＋'),parts:[...parts],kind:'力量',minutes,icon:'dumbbell'};}
function restPlan(){return {title:'休息',parts:[],kind:'休息',minutes:0,icon:'leaf'};}
function aerobicPlan(minutes=20){return {title:'有氧',parts:[],kind:'有氧',minutes,icon:'footprints'};}
function generateWeek(n){const days=Array.from({length:7},restPlan);templates[n].forEach(([i,parts])=>{days[i]=parts==='有氧'?aerobicPlan():musclePlan(parts,n<=2?30:25);});return days;}
function planFields(d){return {title:d.title,parts:[...(d.parts||[])],kind:d.kind,minutes:d.minutes,icon:d.icon};}
function getMuscles(text){return [...new Set((text.match(/肱二头|肱三头|二头|三头|胸肌|背部|肩部|臀腿|核心|胸|背|肩|臀|腿/g)||[]).map(v=>({肱二头:'二头',肱三头:'三头',胸肌:'胸',背部:'背',肩部:'肩'}[v]||v)))];}
